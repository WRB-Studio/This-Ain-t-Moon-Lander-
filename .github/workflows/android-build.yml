name: Android APK

on:
  push:
    branches:
      - gptweb/main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Extract Unity Personal serial
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail

          developer_data="$(printf '%s' "$UNITY_LICENSE" | sed -n 's/.*<DeveloperData Value="\([^"]*\)".*/\1/p' | head -n 1)"
          if [ -z "$developer_data" ]; then
            echo "::error::UNITY_LICENSE does not contain DeveloperData."
            exit 1
          fi

          unity_serial="$(printf '%s' "$developer_data" | base64 --decode | tr -d '\r\n')"
          if [ -z "$unity_serial" ]; then
            echo "::error::Could not extract Unity serial from UNITY_LICENSE."
            exit 1
          fi

          echo "::add-mask::$unity_serial"
          echo "UNITY_SERIAL=$unity_serial" >> "$GITHUB_ENV"

      - name: Build Android APK
        id: unityBuild
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidPackage

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: This-Aint-Moon-Lander-Android-${{ github.run_number }}
          path: build/Android/**/*.apk
          if-no-files-found: error
          retention-days: 1
